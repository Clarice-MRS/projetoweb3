<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css" />
    <title>LG MONSTER</title>
</head>
<header>
        <h1>LG MONSTER</h1>
</header>
<body>
    <main>
        <div class="sacola">
            <button id="botao-sanduiches">
                <span>Sanduíches</span>
            </button>
            <button id="botao-acompanhamentos">
                <span>Acompanhamentos</span>
            </button>
            <button id="botao-bebidas">
                <span>Bebidas</span>
            </button>
            <button id="botao-sobremesas">
                <span>Sobremesas</span>
            </button>
            <button id="botao-sacola">
                <i class="bi bi-basket"></i>
            </button>
        </div>

    <section class="cardapio">
        <div class="item-info">
            <h3 class="nome"></h3>
            <p class="valor"></p>
            <p class="descricao"></p>
        </div>
        <div class="item-quantia">
            <button type="button" class="diminuir-quantia"><i class="bi bi-dash"></i></button>
            <span id="valor-quantia">0</span>
            <button type="button" class="aumentar-quantia"><i class="bi bi-plus"></i></button>
            <button class="adicionar-item">Adicionar</button>
        </div>
        
    </section>   
    </main>
    <script src="script.js"></script>   
</body>
    <footer>

    </footer>
</html>
